name: Sign vehicle registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vehicle-registry.source.json
      - tools/sign_vehicle_registry.py

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign registry
        env:
          VEHICLE_REGISTRY_SIGNING_KEY: ${{ secrets.VEHICLE_REGISTRY_SIGNING_KEY }}
        run: python3 tools/sign_vehicle_registry.py
      - name: Commit signed registry
        run: |
          if git diff --quiet -- vehicle-registry.json vehicle-registry.sig; then
            echo "Registry is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vehicle-registry.json vehicle-registry.sig
          git commit -m "Sign vehicle registry"
          git push
